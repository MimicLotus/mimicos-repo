<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" width="100%" height="100%">
  <defs>
    <linearGradient id="stealthBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e11"/>
      <stop offset="50%" stop-color="#08090b"/>
      <stop offset="100%" stop-color="#040506"/>
    </linearGradient>
  </defs>

  <rect width="3840" height="2160" fill="url(#stealthBg)"/>

  <!-- Offset Watermark Wireframe Crown (Bottom-Right) -->
  <g transform="translate(1000, 300)" stroke="#1de9b6" stroke-width="1.8" stroke-opacity="0.35" fill="#00e676" fill-opacity="0.025">
    <!-- Center Apex -->
    <polygon points="1920,600 1820,1100 1920,1260"/>
    <polygon points="1920,600 2020,1100 1920,1260"/>
    
    <!-- Outer Wings -->
    <polygon points="1640,780 1820,1100 1700,1260"/>
    <polygon points="2200,780 2020,1100 2140,1260"/>
    
    <!-- Base Plate -->
    <polygon points="1700,1260 1920,1260 1810,1360"/>
    <polygon points="2140,1260 1920,1260 2030,1360"/>
    <polygon points="1810,1360 1920,1260 2030,1360 1920,1440"/>

    <!-- Vertex Points -->
    <circle cx="1920" cy="600" r="5" fill="#69f0ae" opacity="0.8"/>
    <circle cx="1640" cy="780" r="4" fill="#69f0ae" opacity="0.6"/>
    <circle cx="2200" cy="780" r="4" fill="#69f0ae" opacity="0.6"/>
    <circle cx="1920" cy="1260" r="4" fill="#69f0ae" opacity="0.6"/>
  </g>
</svg>
